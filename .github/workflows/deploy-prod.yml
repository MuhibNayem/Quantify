name: Deploy Prod

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (defaults to latest main SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  ENVIRONMENT: prod
  NAMESPACE: quantify

jobs:
  approve:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.quantify.com
    steps:
      - run: echo "Production deployment approved"

  deploy:
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy canary (5%)
        run: |
          helm upgrade --install quantify-backend deploy/helm/quantify-backend \
            --namespace ${{ env.NAMESPACE }} \
            --values deploy/helm/quantify-backend/values-prod.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --set replicaCount=1 \
            --wait --timeout 10m

          helm upgrade --install quantify-ai-service deploy/helm/quantify-ai-service \
            --namespace ${{ env.NAMESPACE }} \
            --values deploy/helm/quantify-ai-service/values-prod.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-service \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --set replicaCount=1 \
            --wait --timeout 10m

      - name: Monitor error rate (10 minutes)
        id: canary-check
        run: |
          echo "Monitoring canary error rate for 10 minutes..."
          FAILURES=0
          for i in $(seq 1 10); do
            sleep 60
            ERROR_RATE=$(curl -sf \
              "${{ secrets.PROMETHEUS_URL }}/api/v1/query?query=sum(rate(http_requests_total{namespace=\"${{ env.NAMESPACE }}\",code=~\"5..\"}[2m]))/sum(rate(http_requests_total{namespace=\"${{ env.NAMESPACE }}\"}[2m]))" \
              | jq -r '.data.result[0].value[1] // "0"')
            echo "Minute $i: error_rate=${ERROR_RATE}"
            if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
              FAILURES=$((FAILURES + 1))
            fi
          done
          if [ "$FAILURES" -ge 3 ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "Error rate exceeded 1% threshold ($FAILURES/10 checks failed)"
            exit 1
          fi
          echo "healthy=true" >> "$GITHUB_OUTPUT"

      - name: Promote to full rollout (25% → 50% → 100%)
        run: |
          for REPLICAS in 2 3; do
            echo "Scaling to $REPLICAS replicas..."
            helm upgrade --install quantify-backend deploy/helm/quantify-backend \
              --namespace ${{ env.NAMESPACE }} \
              --values deploy/helm/quantify-backend/values-prod.yaml \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend \
              --set image.tag=${{ steps.tag.outputs.tag }} \
              --set replicaCount=$REPLICAS \
              --wait --timeout 10m
            sleep 30
          done

          helm upgrade --install quantify-backend deploy/helm/quantify-backend \
            --namespace ${{ env.NAMESPACE }} \
            --values deploy/helm/quantify-backend/values-prod.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --wait --timeout 10m

          helm upgrade --install quantify-ai-service deploy/helm/quantify-ai-service \
            --namespace ${{ env.NAMESPACE }} \
            --values deploy/helm/quantify-ai-service/values-prod.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-service \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --wait --timeout 10m

      - name: Run smoke tests
        run: |
          ./scripts/smoke-test.sh "https://api.quantify.com"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚀 Production deploy succeeded — `${{ steps.tag.outputs.tag }}` by ${{ github.actor }}"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 Production deploy FAILED — `${{ steps.tag.outputs.tag }}` by ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Notify PagerDuty on failure
        if: failure()
        run: |
          curl -X POST "https://events.pagerduty.com/v2/enqueue" \
            -H "Content-Type: application/json" \
            -d '{
              "routing_key": "${{ secrets.PAGERDUTY_ROUTING_KEY }}",
              "event_action": "trigger",
              "payload": {
                "summary": "Quantify production deploy failed: ${{ steps.tag.outputs.tag }}",
                "source": "github-actions",
                "severity": "critical",
                "custom_details": {
                  "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "actor": "${{ github.actor }}"
                }
              }
            }'

  auto-rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Rollback
        run: |
          ./scripts/rollback.sh prod

      - name: Notify Slack rollback
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "⏪ Production auto-rollback completed"
