host: localhost:8080
info:
  contact: {}
  description: Inventory management and POS system API
  title: Quantify API
  version: "1.0"
paths:
  /alerts:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all active stock-related alerts
      parameters:
      - description: Filter by alert type (LOW_STOCK, OUT_OF_STOCK, OVERSTOCK, EXPIRY_ALERT)
        in: query
        name: type
        type: string
      - description: Filter by alert status (ACTIVE, RESOLVED)
        in: query
        name: status
        type: string
      - description: Filter by Product ID
        in: query
        name: productId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/inventory_backend_internal_domain.Alert'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a list of all active alerts
      tags:
      - alerts
  /alerts/{alertId}:
    get:
      consumes:
      - application/json
      description: Retrieves details of a specific alert by its ID
      parameters:
      - description: Alert ID
        in: path
        name: alertId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inventory_backend_internal_domain.Alert'
        "404":
          description: Alert not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get an alert by ID
      tags:
      - alerts
  /alerts/{alertId}/resolve:
    patch:
      consumes:
      - application/json
      description: Marks a specific alert as resolved
      parameters:
      - description: Alert ID
        in: path
        name: alertId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inventory_backend_internal_domain.Alert'
        "404":
          description: Alert not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Resolve an alert
      tags:
      - alerts
  /alerts/subscriptions:
    get:
      description: Retrieves a list of all current alert-role subscriptions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/inventory_backend_internal_domain.AlertRoleSubscription'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all alert role subscriptions
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: Creates a new subscription to link a role with an alert type.
      parameters:
      - description: Subscription details
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/inventory_backend_internal_requests.CreateAlertRoleSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/inventory_backend_internal_domain.AlertRoleSubscription'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create an alert role subscription
      tags:
      - alerts
  /alerts/subscriptions/{id}:
    delete:
      description: Deletes a subscription by its ID.
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete an alert role subscription
      tags:
      - alerts
  /barcodes/generate:
    get:
      consumes:
      - application/json
      description: Generates a barcode image (PNG) for a given product SKU or ID
      parameters:
      - description: Product SKU
        in: query
        name: sku
        type: string
      - description: Product ID
        in: query
        name: productId
        type: integer
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Product not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Generate a barcode image for a product
      tags:
      - barcodes
  /bulk/files/{bucket}/{object}:
    get:
      consumes:
      - application/json
      description: Downloads a file (import/export) from the bulk storage bucket
      parameters:
      - description: Bucket Name
        in: path
        name: bucket
        required: true
        type: string
      - description: Object Name
        in: path
        name: object
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: File not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Download a file from bulk storage
      tags:
      - bulk
  /bulk/jobs:
    get:
      consumes:
      - application/json
      description: Retrieves a list of the most recent bulk import/export jobs
      produces:
      - application/json
      responses:
        "200":
          description: List of recent jobs
          schema:
            items:
              $ref: '#/definitions/inventory_backend_internal_domain.Job'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List recent bulk jobs
      tags:
      - bulk
  /bulk/products/export:
    get:
      consumes:
      - application/json
      description: Exports the entire product catalog or a filtered list of products
        to a CSV/Excel file
      parameters:
      - default: csv
        description: Export format (csv, excel)
        in: query
        name: format
        type: string
      - description: Filter by Category ID
        in: query
        name: category
        type: integer
      - description: Filter by Supplier ID
        in: query
        name: supplier
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Export job started
          schema:
            $ref: '#/definitions/inventory_backend_internal_domain.Job'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Export product catalog
      tags:
      - bulk
  /bulk/products/import:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a CSV/Excel file for bulk product creation/update. Returns
        a job ID for status tracking.
      parameters:
      - description: CSV/Excel file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Bulk import job started
          schema:
            $ref: '#/definitions/inventory_backend_internal_domain.Job'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload a file for bulk product import
      tags:
      - bulk
  /bulk/products/import/{jobId}/confirm:
    post:
      consumes:
      - application/json
      description: Confirms and executes the bulk import after preview
      parameters:
      - description: Bulk Import Job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Bulk import confirmation status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Job not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Confirm and execute bulk import
      tags:
      - bulk
  /bulk/products/import/{jobId}/status:
    get:
      consumes:
      - application/json
