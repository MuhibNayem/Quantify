      payload:
        type: string
      permission:
        type: string
      title:
        type: string
      type:
        type: string
    required:
    - message
    - permission
    - title
    - type
    type: object
  internal_handlers.ReturnRequest:
    properties:
      items:
        items:
          properties:
            condition:
              type: string
            order_item_id:
              type: integer
            quantity:
              type: integer
            reason:
              type: string
          required:
          - order_item_id
          - quantity
          - reason
          type: object
        type: array
      order_number:
        type: string
    required:
    - items
    - order_number
    type: object
