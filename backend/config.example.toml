# Quantify backend configuration
# Copy to config.toml and adjust. Environment variables override all values.

APP_ENV = "dev"
SERVER_PORT = "8080"

# PostgreSQL
DB_HOST = "localhost"
DB_PORT = "5432"
DB_USER = "user"
DB_PASSWORD = "password"
DB_NAME = "inventory_db"

# Redis
REDIS_ADDR = ""
REDIS_CLUSTER_ADDRS = ["redis1:6379", "redis2:6379", "redis3:6379"]
REDIS_PASSWORD = "redispass"

# RabbitMQ
RABBITMQ_URL = "amqp://guest:guest@localhost:5672/"

# JWT
JWT_SECRET = "change-me"
REFRESH_TOKEN_SECRET = "change-me"
REFRESH_TOKEN_TTL = "720h"

# CORS / WebSocket
WS_ALLOWED_ORIGINS = ["http://localhost:5173"]
CORS_ALLOWED_ORIGINS = ["http://localhost:5173"]

# SMTP
SMTP_HOST = ""
SMTP_PORT = 587
SMTP_USER = ""
SMTP_PASS = ""
SMTPSENDER = ""

# SSLCommerz
SSLCOMMERZ_STORE_ID = ""
SSLCOMMERZ_STORE_PASSWORD = ""
SSLCOMMERZ_API_HOST = "https://sandbox.sslcommerz.com"
SSLCOMMERZ_SUCCESS_URL = "http://localhost:8080/payment/success"
SSLCOMMERZ_FAIL_URL = "http://localhost:8080/payment/fail"
SSLCOMMERZ_CANCEL_URL = "http://localhost:8080/payment/cancel"
SSLCOMMERZ_IPN_URL = "http://localhost:8080/payment/ipn"

# bKash
BKASH_API_KEY = ""
BKASH_API_SECRET = ""
BKASH_USERNAME = ""
BKASH_PASSWORD = ""
BKASH_BASE_URL = "https://sandbox.bkash.com/v1.2.0-beta"

# MinIO
MINIO_ENDPOINT = "localhost:9000"
MINIO_ACCESS_KEY_ID = "change-me"
MINIO_SECRET_ACCESS_KEY = "change-me"
MINIO_BUCKET_NAME = "reports"
MINIO_USE_TLS = false

# Analytics cache TTLs
SALES_TRENDS_CACHE_TTL = "5m"
INVENTORY_TURNOVER_CACHE_TTL = "5m"
PROFIT_MARGIN_CACHE_TTL = "5m"

# RabbitMQ consumer
CONSUMER_CONCURRENCY = 1

# AI service
AI_SERVICE_URL = "http://localhost:8001"
