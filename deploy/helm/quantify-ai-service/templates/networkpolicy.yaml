{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quantify-ai-service.fullname" . }}
  labels:
    {{- include "quantify-ai-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quantify-ai-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowBackend }}
    # Only the backend may call the AI service.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quantify-backend
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          {{- with $.Values.networkPolicy.ingressPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Callbacks to the backend (same namespace).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quantify-backend
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.networkPolicy.egress.allowExternalHttps }}
    # External LLM / inference APIs over HTTPS.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
