# Development overrides for the AI service.

replicaCount: 1

image:
  pullPolicy: Always

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

podAntiAffinity:
  enabled: false

topologySpreadConstraints:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: false

config:
  BACKEND_URL: http://quantify-backend:8080
