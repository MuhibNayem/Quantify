{{- if .Values.networkPolicy.enabled }}
{{- $infraNamespace := default .Release.Namespace .Values.networkPolicy.egress.infraNamespace -}}
{{- $infraInstance := default "quantify-infrastructure" .Values.networkPolicy.egress.infraInstance -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quantify-backend.fullname" . }}
  labels:
    {{- include "quantify-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quantify-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller may reach the backend.
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.ingressPodLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.networkPolicy.allowAiService }}
    # Allow the AI service (same namespace) to call back into the backend.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quantify-ai-service
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
  egress:
    # Always allow DNS resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $infraNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ $infraInstance }}
      ports:
        - protocol: TCP
          port: 5432
    # Redis cluster (data + bus)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $infraNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-cluster
              app.kubernetes.io/instance: {{ $infraInstance }}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
    # RabbitMQ (AMQP + management)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $infraNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/instance: {{ $infraInstance }}
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
    # MinIO (API + console)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $infraNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/instance: {{ $infraInstance }}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
    # AI service (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quantify-ai-service
      ports:
        - protocol: TCP
          port: 8000
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
