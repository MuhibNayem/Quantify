apiVersion: v2
name: quantify-infrastructure
description: Data-layer infrastructure for Quantify (PostgreSQL, Redis cluster, RabbitMQ, MinIO) via Bitnami subcharts
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - quantify
  - postgresql
  - redis
  - rabbitmq
  - minio
home: https://github.com/your-username/quantify
maintainers:
  - name: Quantify Team
dependencies:
  # Run `helm dependency update` after editing versions.
  - name: postgresql
    version: ">=15.0.0 <17.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis-cluster
    version: ">=9.0.0 <11.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis-cluster.enabled
  - name: rabbitmq
    version: ">=14.0.0 <16.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
  - name: minio
    version: ">=14.0.0 <16.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
