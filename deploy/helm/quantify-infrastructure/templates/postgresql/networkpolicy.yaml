{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql-access
  labels:
    {{- include "quantify-infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Intra-release traffic: streaming replication, metrics, etc.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    # Application access from the Quantify namespaces.
    - from:
        {{- include "quantify-infrastructure.appFrom" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
