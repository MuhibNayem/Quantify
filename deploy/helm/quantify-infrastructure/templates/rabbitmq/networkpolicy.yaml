{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.rabbitmq.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-rabbitmq-access
  labels:
    {{- include "quantify-infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Intra-release traffic: Erlang clustering (epmd, dist, clustering).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    # Application access from the Quantify namespaces.
    - from:
        {{- include "quantify-infrastructure.appFrom" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
{{- end }}
