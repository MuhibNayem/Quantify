apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantify-backend-secrets
  namespace: quantify
  labels:
    app.kubernetes.io/part-of: quantify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: quantify-backend
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: quantify/backend
        property: db_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: quantify/backend
        property: jwt_secret
    - secretKey: REFRESH_TOKEN_SECRET
      remoteRef:
        key: quantify/backend
        property: refresh_token_secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: quantify/backend
        property: redis_password
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: quantify/backend
        property: rabbitmq_url
    - secretKey: MINIO_ACCESS_KEY_ID
      remoteRef:
        key: quantify/backend
        property: minio_access_key_id
    - secretKey: MINIO_SECRET_ACCESS_KEY
      remoteRef:
        key: quantify/backend
        property: minio_secret_access_key
    - secretKey: SMTP_USER
      remoteRef:
        key: quantify/backend
        property: smtp_user
    - secretKey: SMTP_PASS
      remoteRef:
        key: quantify/backend
        property: smtp_pass
    - secretKey: SSLCOMMERZ_STORE_ID
      remoteRef:
        key: quantify/backend
        property: sslcommerz_store_id
    - secretKey: SSLCOMMERZ_STORE_PASSWORD
      remoteRef:
        key: quantify/backend
        property: sslcommerz_store_password
    - secretKey: BKASH_API_KEY
      remoteRef:
        key: quantify/backend
        property: bkash_api_key
    - secretKey: BKASH_API_SECRET
      remoteRef:
        key: quantify/backend
        property: bkash_api_secret
    - secretKey: BKASH_USERNAME
      remoteRef:
        key: quantify/backend
        property: bkash_username
    - secretKey: BKASH_PASSWORD
      remoteRef:
        key: quantify/backend
        property: bkash_password
