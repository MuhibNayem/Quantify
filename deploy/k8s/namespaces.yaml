# Namespaces for the Quantify platform.
# Apply first:  kubectl apply -f deploy/k8s/namespaces.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: quantify
  labels:
    app.kubernetes.io/part-of: quantify
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/part-of: quantify
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: quantify
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: quantify
    # Prometheus needs to scrape across namespaces; keep enforce at baseline.
    pod-security.kubernetes.io/enforce: baseline
