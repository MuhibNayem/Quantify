global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
    - match:
        severity: warning
      receiver: "default"

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://localhost:9095/webhook"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://localhost:9095/webhook"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
